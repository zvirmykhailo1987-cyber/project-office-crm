name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app scripts tests

      - name: Types (mypy — strict on the security and i18n core)
        run: mypy

      - name: Tests + coverage
        env:
          UI_DEFAULT_LANG: uk
        run: pytest -q -p no:cacheprovider --cov --cov-report=term --cov-fail-under=75

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Static security analysis (bandit)
        run: bandit -q -r app scripts -c pyproject.toml

      - name: PII scan — repo + freshly seeded demo database (pattern mode)
        env:
          OFIS_ENV: demo
          DATA_DIR: ${{ runner.temp }}/demo
        run: |
          python -m app.seed_demo --reset
          python scripts/pii_scan.py --repo . --demo-db "$DATA_DIR/ofis.sqlite"

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the demo
        run: docker compose up -d --build
      - name: Wait for the health check
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8030/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Security headers are served
        run: curl -fsS -D - -o /dev/null http://127.0.0.1:8030/login | grep -i "content-security-policy"
      - if: always()
        run: docker compose down -v
