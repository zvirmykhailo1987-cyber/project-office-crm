<!-- porozhni.svg — ілюстрації порожніх станів (окремий шар бібліотеки, 07.08.2026).
     Джерело: ofis_crm/templates/_porozhno.html (перенесено як є; джерело не чіпане).
     Сітка 96×64 · та сама вага лінії, що й в ikony.svg: stroke 1.5, round cap/join,
     currentColor. Мова мотиву: пунктир = «ще нема», одна залита крапка на 50 % =
     тиха крапка-акцент. Набір має читатись однією рукою з іконками.
     Використання: <svg class="znak"><use href="#p-arkush"/></svg>
     (зовнішній файл: <use href="porozhni.svg#p-arkush"/>) -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Порожня папка-справа: ще нічого не заведено -->
    <symbol id="p-arkush" viewBox="0 0 96 64" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 12h30l6 6h16v34H22z"/>
      <path d="M30 30h26M30 38h18" stroke-dasharray="2 4"/>
      <circle cx="66" cy="42" r="2.5" fill="currentColor" stroke="none" opacity=".5"/>
    </symbol>

    <!-- Лупа над лінійками: шукали — не знайшли -->
    <symbol id="p-poshuk" viewBox="0 0 96 64" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 18h34M20 26h26M20 34h18M20 42h30" stroke-dasharray="2 4"/>
      <circle cx="64" cy="30" r="11"/><path d="m72 38 8 8"/>
    </symbol>

    <!-- Стрічка з обірваною лінією: немає подій -->
    <symbol id="p-strichka" viewBox="0 0 96 64" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 14v14M24 40v10" />
      <circle cx="24" cy="34" r="3"/>
      <path d="M36 20h34M36 34h24M36 48h30" stroke-dasharray="2 4"/>
    </symbol>

    <!-- Конверт із пунктирним клапаном: листів ще не слали -->
    <symbol id="p-lyst" viewBox="0 0 96 64" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 18h48v30H24z"/>
      <path d="m24 20 24 16 24-16" stroke-dasharray="3 4"/>
    </symbol>

    <!-- Воронка без крапель: угод немає -->
    <symbol id="p-voronka" viewBox="0 0 96 64" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 14h36l-13 15v16l-10-5V29z"/>
      <path d="M48 52v4" stroke-dasharray="2 3"/>
    </symbol>

    <!-- Витяг: аркуш ліворуч, дужка й порожні поля праворуч — розібрати ще нічого -->
    <symbol id="p-vytyah" viewBox="0 0 96 64" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 12h24l6 6v34H18z"/>
      <path d="M26 28h16M26 36h10" stroke-dasharray="2 4"/>
      <path d="M62 18h-4v28h4"/>
      <path d="M68 24h12M68 32h16M68 40h9" stroke-dasharray="2 4"/>
    </symbol>

    <!-- Імпорт: база й пунктирна стрілка згори — ще нічого не заводили -->
    <symbol id="p-import" viewBox="0 0 96 64" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="48" cy="34" rx="16" ry="5"/>
      <path d="M32 34v14c0 3 7 5 16 5s16-2 16-5V34"/>
      <path d="M48 10v12" stroke-dasharray="3 4"/>
      <path d="m43 17 5 5 5-5"/>
    </symbol>

    <!-- Спокій: рівна лінія з одним ударом. НЕ порожнеча — це добра новина,
         і тека тут брехала б настроєм. -->
    <symbol id="p-spokiy" viewBox="0 0 96 64" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 34h18l4-8 5 16 4-8h33"/>
      <circle cx="84" cy="34" r="2.5" fill="currentColor" stroke="none" opacity=".5"/>
    </symbol>

    <!-- Документ: загнутий ріг і пунктирна печатка — не підписано -->
    <symbol id="p-dokument" viewBox="0 0 96 64" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 10h24l12 12v32H30z"/>
      <path d="M54 10v12h12"/>
      <path d="M38 32h20M38 40h12" stroke-dasharray="2 4"/>
      <circle cx="58" cy="44" r="4" stroke-dasharray="2 3"/>
    </symbol>

    <!-- Активність: сигнал, який ще не пішов — крапка й пунктирні хвилі -->
    <symbol id="p-aktyvnist" viewBox="0 0 96 64" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="32" r="3" fill="currentColor" stroke="none" opacity=".5"/>
      <path d="M40 24a11 11 0 0 1 0 16" stroke-dasharray="3 4"/>
      <path d="M48 18a20 20 0 0 1 0 28" stroke-dasharray="3 4"/>
      <path d="M56 12a29 29 0 0 1 0 40" stroke-dasharray="3 4"/>
    </symbol>

    <!-- Розмова без реплік: у кімнаті тихо -->
    <symbol id="p-chat" viewBox="0 0 96 64" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 16h40v24H32l-9 8V16Z"/>
      <path d="M64 26h14v18H68l-6 5V26Z" stroke-dasharray="3 4"/>
      <path d="M28 24h20M28 31h13" stroke-dasharray="2 4"/>
    </symbol>
  </defs>
</svg>
