; Налаштування прогону тестів.
;
; ЧОМУ ЦЕЙ ФАЙЛ ЗʼЯВИВСЯ (06.08.2026, знахідка передрелізного гейта).
; На 311 тестів припадало 10 006 попереджень — усі два однакові, повторені
; тисячі разів. Проблема не в них самих, а в тому, що наступне СПРАВЖНЄ
; попередження в цій купі побачити неможливо: воно проїде повз очі як 10 007-ме.
;
; Тому глушимо рівно два ВІДОМІ джерела, поіменно, а не «попередження взагалі».
; Будь-яке інше лишається видимим — саме заради нього все це й робиться.
;
; Помилками їх НЕ робимо навмисно: тоді оновлення сторонньої бібліотеки
; валило б увесь прогін на речі, яка нічого не ламає, і гейт почав би
; заважати замість допомагати.
;
; БОРГ ЗАКРИТО 25.09.2026: `app/models/base.py` і `app/templating.py` більше не
; викликають `datetime.utcnow()`; тепер `datetime.now(timezone.utc).replace(tzinfo=None)`,
; тобто той самий НАЇВНИЙ UTC (типи в моделях і порівняннях не змінились).
; Тому фільтр utcnow прибрано: якщо він повернеться, попередження знову буде видно.

[pytest]
testpaths = tests
filterwarnings =
    default
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ; Starlette 1.7+: те саме повідомлення, але як StarletteDeprecationWarning(UserWarning)
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning

; СТЕЛЯ ПОПЕРЕДЖЕНЬ (25.09.2026). Після закриття боргу utcnow лишилось рівно ОДНЕ
; попередження на весь прогін (377 тестів): Starlette 1.7 про httpx у TestClient
; («install `httpx2` instead»). Фільтр вище його НЕ ловить: у Starlette 1.7 це
; вже `StarletteDeprecationWarning(UserWarning)`, а не `DeprecationWarning`,
; тобто фільтр застарів разом із бібліотекою. Він стороннє й нічого не ламає.
; Поріг = 1 — рівно те, що є зараз: будь-яке ДРУГЕ попередження (наше чи нове
; стороннє) робить прогін червоним, навіть якщо всі тести зелені. Коли Starlette
; прибрано/оновлено або фільтр виправлено — знизити до 0.
; 25.09.2026 (пізніше): фільтр доповнено для UserWarning → попереджень 0, поріг знижено до 0.
max_warnings = 0
